<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form >

        <h1 align="center"><b>Student Registration Form</b></h1>

        <br>
        <br>
        <hr>
        
        <label for="naam">Full Name:</label>
        <input type="text" id="naam" placeholder="Enter the full N=name">
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Enter the valid email ">
        <br>
        <br>

        <label for="gender">Gender:</label>
        <input type="radio" value="Male" name="gender">Male
        <input type="radio" value="Female" name="gender">Female
        <input type="radio" value="other" name="gender">other
        <br>
        <br>

        <label for="course">Course</label>
        <select name="course" id="course">
            <option value="select course">--select course</option>
            <option value="Btech">Btech</option>
            <option value="MBA">MBA</option>
            <option value="other">other</option>
        </select>
        <br>
        <br>
        <label for="number">Contact No:</label>
        <input type="text" id="number" placeholder="Enter phone number">
        <br>
        <br>
        <label for="address">Address</label>
        <br>
        <textarea name="address" id="address" placeholder="Enter the address" cols="50",row="10" ></textarea>

        <br>
        <button>Register</button>
        <Button>Clear</Button>
        <hr>
        <p align="center">&copy;2026 Student Registration Portal</p>
    </form>
    
</body>
</html>
