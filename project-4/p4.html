<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    
    <form align="center">

        <h1 >Hotel Room Booking Form</h1>

        <label for="naam">Full Name:</label>
        <input type="text" id="naam">
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="text" id="email">
        <br>
        <br>
        <label for="number">Phone:</label>
        <input type="text" id="number">
        <br>
        <br>
        <label for="date">Check-in Date:</label>
        <input type="date" id="date">
        <br>
        <br>
        <label for="date2">Check-out Date:</label>
        <input type="date" id="date2">
        <br>
        <br>
        <label for="room">Room Type:</label>
        <select name="room" id="room">
            <option value="Single Room">Single Room</option>
            <option value="Double Room">Double Room</option>
            <option value="other">other </option>
        </select>
        <br>
        <br>
        <label for="guest">Number of Guest:</label>
        <input type="number" id="guest">
        <br>
        <br>

        <label for="text">Special Request:</label>
        <br>
        <textarea name="request" id="text" cols="50" rows="7"></textarea>
        <br>
        <br>
        
        <button>Book Now</button>
        <button>Reset Form</button>

       

        
        
    </form>
         
    
    
</body>
</html>
